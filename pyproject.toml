    # Data — stocks
    "yfinance==1.4.0",
    "stockstats==0.6.8",
    "alpha-vantage==3.0.0",
    # Data — mutual funds (Indian)
    "requests==2.34.2",
    # Structured output
    "pydantic==2.13.4",
    # CLI / TUI
    "typer==0.25.1",
    "questionary==2.1.1",
    "rich==15.0.0",
    # Environment
    "python-dotenv==1.2.2",
